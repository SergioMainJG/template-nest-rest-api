apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  restartPolicy: Always
  initContainers:
    - name: migrate
      image: localhost/app:latest
      imagePullPolicy: Never
      command: ["bun", "dist/migrate.js"]
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-env
              key: DATABASE_URL
  containers:
    - name: api
      image: localhost/app:latest
      imagePullPolicy: Never
      envFrom:
        - secretRef:
            name: app-env
      env:
        - name: NODE_ENV
          value: production
        - name: HOST
          value: 127.0.0.1
        - name: PORT
          value: "3000"
      livenessProbe:
        exec:
          command:
            - bun
            - -e
            - "const r = await fetch('http://127.0.0.1:3000/health/live'); process.exit(r.ok ? 0 : 1)"
        initialDelaySeconds: 10
        periodSeconds: 30
