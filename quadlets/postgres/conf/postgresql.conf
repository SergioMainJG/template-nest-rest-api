listen_addresses = '*'
port = 5432
max_connections = 100

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

max_wal_size = 1GB
min_wal_size = 80MB

password_encryption = scram-sha-256

log_timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms

timezone = 'UTC'
datestyle = 'iso, mdy'
